# SonarQube Cloud analysis, run from the `demo` job in .github/workflows/ci.yml.
sonar.organization=pihme
sonar.projectKey=pihme_ragite-demo
sonar.projectName=ragite-demo

sonar.sources=app,scripts,examples
sonar.tests=tests
sonar.exclusions=app/static/fonts/**,app/demo.db,app/demo.db.part
sonar.sourceEncoding=UTF-8

# scripts/build-demo-db is Python without a .py suffix.
sonar.lang.patterns.py=**/*.py,scripts/build-demo-db
sonar.python.version=3.10,3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml
# Only the build script is measured. The front end and the SQL examples are
# exercised over HTTP and in the sqlite3 shell, which coverage.py cannot see.
sonar.coverage.exclusions=app/**,examples/**,scripts/run-examples,scripts/smoke
