title: ragite demo
description_html: |-
  Hybrid search over the SQLite documentation, a few Wikipedia articles and the ragite docs,
  run by the <a href="https://github.com/pihme/ragite">ragite</a> SQLite extension.
  <strong><a href="/search">Open the search page</a></strong> or use the canned queries below.
license: Mixed, see DATA_SOURCES.md
license_url: https://github.com/pihme/ragite-demo/blob/main/DATA_SOURCES.md
source: ragite-demo
source_url: https://github.com/pihme/ragite-demo
databases:
  demo:
    tables:
      docs:
        description: ragite Document table. Write here; search with WHERE docs MATCH 'question'.
      docs_chunks:
        description: Read-only companion with one row per chunk. Search with WHERE docs_chunks MATCH 'question'.
      doc_info:
        description: Title, URL, collection, language, license and revision of every document (doc_id matches docs).
        sort: doc_id
      build_info:
        description: Versions and checksums of the build that produced this file.
      docs_documents: {hidden: true}
      docs_chunk_rows: {hidden: true}
      docs_model: {hidden: true}
      # Storage tables ragite creates; hidden from the table list only, never queried.
      docs_vec: {hidden: true}
      docs_vec_chunks: {hidden: true}
      docs_vec_info: {hidden: true}
      docs_vec_rowids: {hidden: true}
      docs_vec_vector_chunks00: {hidden: true}
      docs_fts: {hidden: true}
    queries:
      search:
        title: Search chunks (hybrid)
        description: >-
          Hybrid search: vector similarity and BM25 full-text ranking fused with Reciprocal Rank Fusion.
          collection is optional (sqlite-docs, wikipedia or ragite-docs).
        sql: |-
          with hits as materialized (
            select rowid as chunk_id, doc_id, chunk, heading_path, score
            from docs_chunks
            where docs_chunks match :q
          )
          select i.title, i.url, i.collection, hits.heading_path, hits.chunk, round(hits.score, 5) as score
          from hits join doc_info i on i.doc_id = hits.doc_id
          where :collection = '' or i.collection = :collection
          order by hits.score desc, hits.chunk_id
          limit 20
      search_documents:
        title: Search documents (hybrid)
        description: One row per document, ranked by its best chunk. collection is optional.
        sql: |-
          with hits as materialized (
            select doc_id, score from docs where docs match :q
          )
          select i.title, i.url, i.collection, i.lang, round(hits.score, 5) as score
          from hits join doc_info i on i.doc_id = hits.doc_id
          where :collection = '' or i.collection = :collection
          order by hits.score desc, hits.doc_id
          limit 10
      chunks_with_document:
        title: Search chunks, joined to their document
        description: >-
          Hybrid search on docs_chunks, joined to the docs table (format, full text length) and to
          doc_info (title, license, revision). start and end are the chunk's position in the document.
        sql: |-
          with hits as materialized (
            select rowid as chunk_id, doc_id, start, "end", chunk, score
            from docs_chunks
            where docs_chunks match :q
            limit 10
          )
          select i.title, i.license, i.revision, d.format, length(d.text) as document_length,
                 hits.start, hits."end", hits.chunk, round(hits.score, 5) as score
          from hits
          join docs d on d.doc_id = hits.doc_id
          join doc_info i on i.doc_id = hits.doc_id
          order by hits.score desc, hits.chunk_id
      document_chunks:
        title: All chunks of one document
        description: Chunks of a document in order, without search (score is null). doc_id comes from doc_info.
        sql: |-
          select rowid as chunk_id, doc_id, source, start, "end", heading_path, chunk
          from docs_chunks
          where doc_id = :doc_id
      model:
        title: Model
        description: The model built into libragite.so, the model the docs table uses, and the build of this file.
        sql: |-
          select m.name, m.technical_id, ragite_table_model('docs') as table_model,
                 (select value from build_info where key = 'ragite_version') as ragite_version
          from ragite_default_model() m
      embed:
        title: Embed text
        description: >-
          ragite_embed with the docs table's model. role is query or passage. Returns a float32 BLOB
          (4 bytes per dimension); shown here as its size and first bytes.
        sql: |-
          select :text as text, :role as role,
                 length(ragite_embed('docs', :text, :role)) / 4 as dimensions,
                 hex(substr(ragite_embed('docs', :text, :role), 1, 16)) as first_16_bytes
          where :text <> ''
