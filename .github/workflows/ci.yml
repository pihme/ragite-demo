name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A push to main may cut a release. Do not cancel that run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Cache downloads (libragite.so, SQLite docs, Wikipedia, ragite docs)
        uses: actions/cache@v6
        with:
          path: |
            libragite.so
            .cache
          key: sources-${{ hashFiles('data/sources.json') }}
      - run: pip install -r requirements-dev.txt
      - name: Build demo.db
        run: make demo-db
      - name: Datasette test client
        run: make test
      - name: SQL examples in the sqlite3 shell
        run: |
          sudo apt-get install -y --no-install-recommends sqlite3 > /dev/null
          scripts/run-examples
      - name: Serve and query over HTTP
        run: |
          make serve PORT=8001 > datasette.log 2>&1 &
          scripts/smoke http://127.0.0.1:8001
      - name: Screenshot the search page
        run: |
          python -m playwright install --with-deps chromium
          python tests/screenshot.py http://127.0.0.1:8001 screenshots
      - name: Data sizes
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import os, sqlite3
          con = sqlite3.connect("app/demo.db")
          print("### Data sizes\n")
          print(f"- demo.db: {os.path.getsize('app/demo.db') / 1e6:.1f} MB, libragite.so: {os.path.getsize('libragite.so') / 1e6:.1f} MB\n")
          print("| collection | documents | cleaned text (MB) |\n| --- | --- | --- |")
          for coll, n, size in con.execute("SELECT collection, count(*), sum(bytes) FROM doc_info GROUP BY collection"):
              print(f"| {coll} | {n} | {size / 1e6:.2f} |")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
      - uses: actions/upload-artifact@v7
        with:
          name: demo-db
          path: |
            app/demo.db
            DATA_SOURCES.md
          retention-days: 14
      - name: Datasette log
        if: always()
        run: cat datasette.log || true

  # After the demo passed on a push to main, release-please opens or updates the
  # release pull request (version.txt, CHANGELOG.md). Merging that pull request
  # tags ragite-demo/vX.Y.Z, creates the GitHub Release and attaches the demo.db
  # built and tested in this run.
  release:
    needs: demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'pihme'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Open the release pull request or cut the release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v7
        if: steps.release.outputs.release_created == 'true'
        with:
          persist-credentials: false

      - name: Download the tested demo.db
        if: steps.release.outputs.release_created == 'true'
        uses: actions/download-artifact@v8
        with:
          name: demo-db
          path: release-out

      - name: Attach demo.db and the license files
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test -s release-out/app/demo.db
          test -s release-out/DATA_SOURCES.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "ragite-demo $VERSION"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            release-out/app/demo.db \
            release-out/DATA_SOURCES.md \
            LICENSE \
            THIRD_PARTY_NOTICES.md
