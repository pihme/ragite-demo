name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A push to main may cut a release. Do not cancel that run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A release-please pull request only bumps the version and the changelog; the
  # code was tested on main. It gets release-pr-check instead. The push to main
  # after the merge still builds and tests demo.db for the release.
  demo:
    if: ${{ !(startsWith(github.head_ref || github.ref_name, 'release-please--') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Scan pull requests and main only, and only when the secret exists.
      # Dependabot and fork PRs get no secret; Dependabot is also skipped explicitly.
      RUN_SONAR: ${{ secrets.SONAR_TOKEN != '' && github.actor != 'dependabot[bot]' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar needs the full history for blame and new-code detection.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Cache downloads (libragite.so, SQLite docs, Wikipedia, RAGite docs)
        uses: actions/cache@v6
        with:
          path: |
            libragite.so
            .cache
          key: sources-${{ hashFiles('data/sources.json') }}
      - run: pip install -r requirements-dev.txt
      # Both steps run under coverage.py (.coveragerc) for SonarQube Cloud.
      - name: Build demo.db
        run: make demo-db PYTHON="python -m coverage run"
      - name: Datasette test client
        run: make test PYTHON="python -m coverage run"
      - name: SQL examples in the sqlite3 shell
        run: |
          sudo apt-get install -y --no-install-recommends sqlite3 > /dev/null
          scripts/run-examples
      - name: Serve and query over HTTP
        run: |
          make serve PORT=8001 > datasette.log 2>&1 &
          scripts/smoke http://127.0.0.1:8001
      - name: Screenshot the search page
        run: |
          python -m playwright install --with-deps chromium
          python tests/screenshot.py http://127.0.0.1:8001 screenshots
      - name: Data sizes
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import os, sqlite3
          con = sqlite3.connect("app/demo.db")
          print("### Data sizes\n")
          print(f"- demo.db: {os.path.getsize('app/demo.db') / 1e6:.1f} MB, libragite.so: {os.path.getsize('libragite.so') / 1e6:.1f} MB\n")
          print("| collection | documents | cleaned text (MB) |\n| --- | --- | --- |")
          for coll, n, size in con.execute("SELECT collection, count(*), sum(bytes) FROM doc_info GROUP BY collection"):
              print(f"| {coll} | {n} | {size / 1e6:.2f} |")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
      - uses: actions/upload-artifact@v7
        with:
          name: demo-db
          path: |
            app/demo.db
            DATA_SOURCES.md
          retention-days: 14
      - name: Datasette log
        if: always()
        run: cat datasette.log || true
      - name: Coverage report for SonarQube Cloud
        if: env.RUN_SONAR == 'true'
        run: |
          python -m coverage combine
          python -m coverage xml -o coverage.xml
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: SonarQube Cloud scan
        if: env.RUN_SONAR == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Replaces the demo job on release-please--* branches: version.txt, the
  # manifest and CHANGELOG.md must agree, and nothing else may change.
  release-pr-check:
    if: ${{ startsWith(github.head_ref || github.ref_name, 'release-please--') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version and changelog
        run: scripts/check-release-pr origin/main

  # After the demo passed on a push to main, release-please opens or updates the
  # release pull request (version.txt, CHANGELOG.md). Merging that pull request
  # tags ragite-demo/vX.Y.Z, creates the GitHub Release and attaches the demo.db
  # built and tested in this run.
  release:
    needs: demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'pihme'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Open the release pull request or cut the release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A pull request opened with GITHUB_TOKEN gets its CI runs held at
          # "action_required" until someone approves them. With a RELEASE_TOKEN
          # secret (fine-grained token: Contents and Pull requests read/write on
          # this repository) the release pull request runs CI on its own.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v7
        if: steps.release.outputs.release_created == 'true'
        with:
          persist-credentials: false

      - name: Download the tested demo.db
        if: steps.release.outputs.release_created == 'true'
        uses: actions/download-artifact@v8
        with:
          name: demo-db
          path: release-out

      - name: Attach demo.db and the license files
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test -s release-out/app/demo.db
          test -s release-out/DATA_SOURCES.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "ragite-demo $VERSION"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            release-out/app/demo.db \
            release-out/DATA_SOURCES.md \
            LICENSE \
            THIRD_PARTY_NOTICES.md
