# Commit prefixes follow the release rules in AGENTS.md (release-please):
#   runtime deps, shipped Docker base images and Nix locks -> fix(deps): patch release
#   dev deps -> chore(deps-dev), GitHub Actions -> ci(deps), unshipped images -> chore(deps): no release
# Nix locks release because CI builds the released demo.db inside nix/browsers
# (which includes nix/sqlite and nix/reference-env), so a lock bump changes a
# release input.
# Never reword a Dependabot title into feat! (see AGENTS.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies, ready-for-maintainer]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies, ready-for-maintainer]
    commit-message:
      prefix: chore
      include: scope
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]
  # All Nix shells in one block and one group: one bundled PR per run.
  # Add every extra shell (nix/<name>/flake.lock) under `directories:`.
  - package-ecosystem: nix
    directories:
      - /nix/reference-env
      - /nix/sqlite
      - /nix/browsers
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies, ready-for-maintainer]
    commit-message:
      # fix, not chore: a Nix lock bump is a release input (see above).
      prefix: fix
      include: scope
    groups:
      nix:
        patterns: ["*"]
